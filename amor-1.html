<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<meta property="og:title" content="Para ti ❤️">
<meta property="og:description" content="Toca para ver tu sorpresa">
<meta property="og:type" content="website">
<!-- 👉 Cambia por la URL completa donde subas og.jpg (misma carpeta que amor.html) -->
<meta property="og:image" content="https://arman2auri0.github.io/formularioDeTrabajo/og.jpg">
<meta property="og:image:width" content="600">
<meta property="og:image:height" content="600">
<style>
  :root{--bg:#2a0a1c;--rose:#ff4d79;--blush:#ffd6e0;--gold:#ffc46b}
  *{box-sizing:border-box;margin:0}
  html,body{height:100%;background:var(--bg);overflow:hidden}
  body{font-family:Georgia,"Times New Roman",serif;color:#fff;-webkit-tap-highlight-color:transparent}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
  a.tap{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    padding-bottom:calc(14vh + env(safe-area-inset-bottom,0px));text-decoration:none;color:inherit}
  h1{font-size:clamp(2.4rem,11vw,4.5rem);font-weight:700;letter-spacing:.01em;text-shadow:0 2px 24px rgba(255,77,121,.6)}
  p{margin-top:.6rem;font-size:1.05rem;color:var(--blush);animation:pulse 2.2s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.45}}
  @media (prefers-reduced-motion:reduce){p{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<a class="tap" id="go" href="#">
  <h1>Te amo</h1>
  <p>Toca para ver tu sorpresa</p>
</a>
<script>
// 👉 CAMBIA ESTE LINK por el tuyo
const LINK = "https://facebook.com";

document.getElementById("go").href = LINK;

// Redirección automática: milisegundos antes de saltar al link (0 = inmediato)
const DELAY_MS = 0;
setTimeout(() => { location.href = LINK; }, DELAY_MS);

const cv = document.getElementById("c"), ctx = cv.getContext("2d");
let W, H, dpr;
function resize(){
  dpr = Math.min(window.devicePixelRatio||1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
resize(); addEventListener("resize", resize);

function hp(t){ // heart curve
  return [16*Math.pow(Math.sin(t),3),
         -(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))];
}
const N = 260, pts = [];
for(let i=0;i<N;i++){
  const t = i/N*Math.PI*2, [x,y] = hp(t);
  pts.push({x,y,ph:Math.random()*6.28});
}
const mini = Array.from({length:22},()=>({
  x:Math.random(), y:Math.random(), s:.4+Math.random()*.9, v:.02+Math.random()*.06, ph:Math.random()*6.28
}));

function drawHeart(x,y,size,color,alpha){
  ctx.save(); ctx.translate(x,y); ctx.scale(size,size); ctx.globalAlpha = alpha; ctx.fillStyle = color;
  ctx.beginPath();
  for(let i=0;i<=60;i++){
    const [px,py] = hp(i/60*Math.PI*2);
    i? ctx.lineTo(px,py) : ctx.moveTo(px,py);
  }
  ctx.fill(); ctx.restore();
}

let last = performance.now();
function frame(now){
  const dt = (now-last)/1000; last = now;
  ctx.clearRect(0,0,W,H);

  for(const m of mini){
    m.y -= m.v*dt;
    if(m.y < -.05){ m.y = 1.05; m.x = Math.random(); }
    drawHeart(m.x*W + Math.sin(now/1000+m.ph)*10, m.y*H, m.s*1.1, "#ff4d79", .22);
  }

  const beat = 1 + .09*Math.pow(Math.max(0,Math.sin(now/1000*4.2)),2);
  const cx = W/2, cy = H*.38, sc = Math.min(W,H)/40*beat;

  ctx.save(); ctx.shadowColor = "rgba(255,77,121,.85)"; ctx.shadowBlur = 40;
  drawHeart(cx,cy,sc*.97,"#ff4d79",1);
  ctx.restore();

  for(const p of pts){
    const w = Math.sin(now/700+p.ph)*.35;
    ctx.beginPath();
    ctx.fillStyle = "#ffc46b";
    ctx.globalAlpha = .85;
    ctx.arc(cx+(p.x*1.12+w)*sc, cy+(p.y*1.12+w)*sc, 1.6, 0, 6.283);
    ctx.fill();
  }
  ctx.globalAlpha = 1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
